name: Expand EPR System source

on:
  push:
    branches: [main]
    paths:
      - "epr-system.zip"

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand the project into the repository root
        run: |
          rm -rf /tmp/epr-system-source
          mkdir -p /tmp/epr-system-source
          unzip -q epr-system.zip -d /tmp/epr-system-source
          cp -a /tmp/epr-system-source/epr-system/. .
          rm -f epr-system.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish corrected EPR System source"
          git push
